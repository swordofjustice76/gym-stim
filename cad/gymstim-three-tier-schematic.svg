<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <rect width="900" height="620" fill="#0f1115"/>
  <text x="450" y="42" text-anchor="middle" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="26" font-weight="700">GymStim — Three-Tier Line (Schematic)</text>
  <text x="450" y="66" text-anchor="middle" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="14">Same 38 × 190 mm cylinder family · shared consumable spine · salts Elite-only</text>

  <!-- LITE -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="230" height="430" rx="18" fill="#1b1f27" stroke="#3a4250" stroke-width="2"/>
    <text x="115" y="-14" text-anchor="middle" fill="#7fd1ff" font-family="Arial" font-size="18" font-weight="700">LITE</text>
    <text x="115" y="8" text-anchor="middle" fill="#c7d0dd" font-family="Arial" font-size="11">ABS / aluminium · no salt chamber</text>
    <!-- body -->
    <rect x="95" y="40" width="40" height="360" rx="20" fill="#2a3140" stroke="#4a5568" stroke-width="2"/>
    <!-- chew zone -->
    <rect x="95" y="150" width="40" height="90" rx="6" fill="#33415c" stroke="#5b6b86" stroke-width="1.5"/>
    <text x="115" y="200" text-anchor="middle" fill="#e8edf5" font-family="Arial" font-size="10">B chew</text>
    <!-- flask zone -->
    <rect x="95" y="250" width="40" height="120" rx="6" fill="#3b4a66" stroke="#6b7fa3" stroke-width="1.5"/>
    <text x="115" y="315" text-anchor="middle" fill="#e8edf5" font-family="Arial" font-size="10">C flask</text>
    <!-- labels -->
    <line x1="150" y1="195" x2="210" y2="195" stroke="#7fd1ff" stroke-width="1"/>
    <text x="214" y="199" fill="#cfe6ff" font-family="Arial" font-size="11">10-tab cassette</text>
    <line x1="150" y1="310" x2="210" y2="310" stroke="#7fd1ff" stroke-width="1"/>
    <text x="214" y="314" fill="#cfe6ff" font-family="Arial" font-size="11">~90 ml powder</text>
    <text x="115" y="430" text-anchor="middle" fill="#9aa3b2" font-family="Arial" font-size="11">~$35–45 retail</text>
  </g>

  <!-- MID -->
  <g transform="translate(335,110)">
    <rect x="0" y="0" width="230" height="430" rx="18" fill="#1b1f27" stroke="#3a4250" stroke-width="2"/>
    <text x="115" y="-14" text-anchor="middle" fill="#ffd166" font-family="Arial" font-size="18" font-weight="700">MID</text>
    <text x="115" y="8" text-anchor="middle" fill="#c7d0dd" font-family="Arial" font-size="11">anodised aluminium · full mechanism</text>
    <rect x="95" y="40" width="40" height="360" rx="20" fill="#2a3140" stroke="#4a5568" stroke-width="2"/>
    <!-- salt zone -->
    <rect x="95" y="50" width="40" height="40" rx="6" fill="#4a3b2a" stroke="#8a6a45" stroke-width="1.5"/>
    <text x="115" y="78" text-anchor="middle" fill="#ffe0b2" font-family="Arial" font-size="9">A salts</text>
    <!-- chew zone -->
    <rect x="95" y="150" width="40" height="90" rx="6" fill="#33415c" stroke="#5b6b86" stroke-width="1.5"/>
    <text x="115" y="200" text-anchor="middle" fill="#e8edf5" font-family="Arial" font-size="10">B chew</text>
    <!-- flask zone -->
    <rect x="95" y="250" width="40" height="120" rx="6" fill="#3b4a66" stroke="#6b7fa3" stroke-width="1.5"/>
    <text x="115" y="315" text-anchor="middle" fill="#e8edf5" font-family="Arial" font-size="10">C flask</text>
    <line x1="150" y1="70" x2="210" y2="70" stroke="#ffd166" stroke-width="1"/>
    <text x="214" y="74" fill="#ffe6b2" font-family="Arial" font-size="11">replaceable cap</text>
    <line x1="150" y1="195" x2="210" y2="195" stroke="#ffd166" stroke-width="1"/>
    <text x="214" y="199" fill="#ffe6b2" font-family="Arial" font-size="11">one-click gate</text>
    <line x1="150" y1="310" x2="210" y2="310" stroke="#ffd166" stroke-width="1"/>
    <text x="214" y="314" fill="#ffe6b2" font-family="Arial" font-size="11">70 ml + fill lines</text>
    <text x="115" y="430" text-anchor="middle" fill="#9aa3b2" font-family="Arial" font-size="11">~$65–85 retail</text>
  </g>

  <!-- ELITE -->
  <g transform="translate(610,110)">
    <rect x="0" y="0" width="230" height="430" rx="18" fill="#1b1f27" stroke="#3a4250" stroke-width="2"/>
    <text x="115" y="-14" text-anchor="middle" fill="#c9a0ff" font-family="Arial" font-size="18" font-weight="700">ELITE</text>
    <text x="115" y="8" text-anchor="middle" fill="#c7d0dd" font-family="Arial" font-size="11">stainless · all attachments</text>
    <rect x="95" y="40" width="40" height="360" rx="20" fill="#2a3140" stroke="#4a5568" stroke-width="2"/>
    <rect x="95" y="50" width="40" height="40" rx="6" fill="#4a3b2a" stroke="#8a6a45" stroke-width="1.5"/>
    <text x="115" y="78" text-anchor="middle" fill="#ffe0b2" font-family="Arial" font-size="9">A salts</text>
    <rect x="95" y="150" width="40" height="90" rx="6" fill="#33415c" stroke="#5b6b86" stroke-width="1.5"/>
    <text x="115" y="200" text-anchor="middle" fill="#e8edf5" font-family="Arial" font-size="10">B chew</text>
    <rect x="95" y="250" width="40" height="120" rx="6" fill="#3b4a66" stroke="#6b7fa3" stroke-width="1.5"/>
    <text x="115" y="315" text-anchor="middle" fill="#e8edf5" font-family="Arial" font-size="10">C flask</text>
    <line x1="150" y1="70" x2="210" y2="70" stroke="#c9a0ff" stroke-width="1"/>
    <text x="214" y="74" fill="#e6d6ff" font-family="Arial" font-size="11">twist port + detent</text>
    <line x1="150" y1="195" x2="210" y2="195" stroke="#c9a0ff" stroke-width="1"/>
    <text x="214" y="199" fill="#e6d6ff" font-family="Arial" font-size="11">B3 one-click</text>
    <line x1="150" y1="310" x2="210" y2="310" stroke="#c9a0ff" stroke-width="1"/>
    <text x="214" y="314" fill="#e6d6ff" font-family="Arial" font-size="11">C3 taper pour</text>
    <text x="115" y="430" text-anchor="middle" fill="#9aa3b2" font-family="Arial" font-size="11">~$95–140 retail</text>
  </g>

  <!-- legend -->
  <g transform="translate(60,560)">
    <rect x="0" y="0" width="780" height="40" rx="8" fill="#161a22" stroke="#2a3140"/>
    <circle cx="20" cy="20" r="6" fill="#4a3b2a"/>
    <text x="34" y="24" fill="#c7d0dd" font-family="Arial" font-size="12">A salts (Elite)</text>
    <circle cx="150" cy="20" r="6" fill="#33415c"/>
    <text x="164" y="24" fill="#c7d0dd" font-family="Arial" font-size="12">B chews (all)</text>
    <circle cx="280" cy="20" r="6" fill="#3b4a66"/>
    <text x="294" y="24" fill="#c7d0dd" font-family="Arial" font-size="12">C flask (all)</text>
    <text x="430" y="24" fill="#9aa3b2" font-family="Arial" font-size="12">Shot capsule = shared consumable, not a tier</text>
  </g>
</svg>